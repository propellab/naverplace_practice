<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>플레이스 실습 환경</title>
<style>
  :root{
    --green:#03C75A;
    --green-deep:#02A94C;
    --green-tint:#E9FBF1;
    --ink:#191919;
    --gray-700:#333D4B;
    --gray-500:#6B7684;
    --gray-300:#B0B8C1;
    --line:#E5E8EB;
    --surface:#F5F6F7;
    --white:#FFFFFF;
    --alert:#F04452;
    --alert-tint:#FDEBEC;
    --purple:#6C5CE7;
    --font: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font);color:var(--ink);background:var(--surface);-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  [onclick]{cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  a{color:inherit;text-decoration:none;}

  /* ===================== practice badge (always visible) ===================== */
  .practice-flag{
    text-align:center;
    background:var(--ink); color:#fff; font-size:11.5px; font-weight:700;
    padding:6px 10px; letter-spacing:.02em;
  }

  /* ===================== LOGIN VIEW ===================== */
  .login-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--surface);
  }
  .login-card{
    width:380px; background:var(--white); border:1px solid var(--line);
    border-radius:16px; padding:40px 36px 32px; text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.06);
  }
  .login-badge{
    width:52px;height:52px;border-radius:14px;background:var(--green);
    color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;
    margin:0 auto 16px;
  }
  .login-title{font-size:19px;font-weight:800;margin:0 0 4px;}
  .login-sub{font-size:13px;color:var(--gray-500);margin:0 0 28px;line-height:1.5;}
  .login-field{text-align:left;margin-bottom:18px;}
  .login-field label{display:block;font-size:12.5px;font-weight:600;color:var(--gray-700);margin-bottom:7px;}
  .login-field input{
    width:100%;border:1.5px solid var(--line);border-radius:9px;
    padding:13px 14px;font-size:15px;outline:none;
  }
  .login-field input:focus{border-color:var(--green);}
  .login-btn{
    width:100%;background:var(--green);color:#fff;border:none;
    border-radius:9px;padding:13px;font-size:15px;font-weight:700;margin-top:4px;
  }
  .login-btn:hover{background:var(--green-deep);}
  .login-btn:disabled{background:var(--gray-300);cursor:default;}
  .login-foot{font-size:11.5px;color:var(--gray-300);margin-top:22px;}

  /* ===================== TOP NAV (dashboard/bizdetail) ===================== */
  .topnav{
    background:var(--white); border-bottom:1px solid var(--line);
    height:60px; display:flex; align-items:center; justify-content:space-between;
    padding:0 24px;
  }
  .tn-left{display:flex;align-items:center;gap:28px;}
  .tn-logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;color:var(--ink);}
  .tn-logo .sq{width:26px;height:26px;border-radius:6px;background:var(--green);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;}
  .tn-menu{display:flex;gap:22px;}
  .tn-menu span{font-size:13.5px;color:var(--gray-700);font-weight:500;}
  .tn-right{display:flex;align-items:center;gap:14px;}
  .tn-user{font-size:13px;font-weight:700;color:var(--green-deep);}
  .tn-logout{font-size:13px;color:var(--gray-500);border-left:1px solid var(--line);padding-left:14px;}
  .tn-logout:hover{color:var(--ink);}

  .page-wrap{max-width:1080px;margin:0 auto;padding:28px 24px 60px;}

  /* ===================== hero banner ===================== */
  .hero{
    background:linear-gradient(120deg,#8FE3C0,#B9EAD3);
    border-radius:14px; padding:36px 40px; margin-bottom:22px;
    display:flex; align-items:center; justify-content:space-between;
    min-height:160px;
  }
  .hero-eyebrow{font-size:13px;font-weight:700;color:#0E5A34;margin-bottom:8px;}
  .hero-title{font-size:22px;font-weight:800;color:#0B3D24;line-height:1.4;max-width:420px;}
  .hero-link{margin-top:12px;font-size:13px;font-weight:700;color:#0B3D24;}
  .hero-visual{
    width:120px;height:100px;background:rgba(255,255,255,.55);border-radius:14px;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#0B3D24;font-weight:700;
  }

  /* ===================== quick icons ===================== */
  .quick-icons{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px;}
  .qi-card{
    background:var(--white);border:1px solid var(--line);border-radius:12px;
    padding:20px 8px;text-align:center;font-size:12.5px;font-weight:700;color:var(--gray-700);
  }
  .qi-card:hover{border-color:var(--green);color:var(--green-deep);}
  .qi-icon{
    width:34px;height:34px;border-radius:50%;background:var(--green-tint);color:var(--green-deep);
    display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:15px;
  }
  @media (max-width:700px){ .quick-icons{grid-template-columns:repeat(3,1fr);} }

  .ad-strip{
    background:var(--surface);border-radius:10px;padding:14px 18px;margin-bottom:30px;
    display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--gray-700);
  }
  .ad-strip button{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;}

  .mybiz-title{font-size:16px;font-weight:800;margin-bottom:14px;}
  .mybiz-title span{color:var(--green-deep);}
  .mybiz-card{
    display:flex;align-items:center;gap:16px;
    background:var(--white);border:1px solid var(--line);border-radius:12px;
    padding:18px 20px;cursor:pointer;
  }
  .mybiz-card:hover{border-color:var(--green);}
  .mybiz-thumb{
    width:56px;height:56px;border-radius:10px;flex-shrink:0;
    background:linear-gradient(135deg,#dfe3e6,#eef0f1);
  }
  .mybiz-name{font-size:15.5px;font-weight:700;color:var(--ink);}
  .mybiz-chev{margin-left:auto;color:var(--gray-300);font-size:18px;}

  /* ===================== NEW BIZ (dead-end) ===================== */
  .nb-back{display:inline-flex;align-items:center;gap:6px;color:var(--gray-500);font-size:14px;margin-bottom:18px;cursor:pointer;}
  .nb-back:hover{color:var(--ink);}
  .nb-title{font-size:24px;font-weight:800;text-align:center;margin-bottom:26px;}
  .nb-search{
    max-width:620px;margin:0 auto 26px;position:relative;
  }
  .nb-search input{
    width:100%;border:1.5px solid var(--line);border-radius:10px;padding:14px 44px 14px 16px;
    font-size:14px;background:var(--surface);color:var(--gray-500);
  }
  .nb-search .ic{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--gray-300);}
  .nb-box{max-width:620px;margin:0 auto;background:var(--surface);border-radius:14px;padding:26px 28px;}
  .nb-box h3{font-size:16px;margin:0 0 4px;}
  .nb-box p{font-size:12.5px;color:var(--gray-500);margin:0 0 18px;}
  .nb-opt{background:var(--white);border-radius:10px;padding:16px 18px;margin-bottom:12px;}
  .nb-opt .num{display:inline-block;background:var(--gray-700);color:#fff;font-size:11px;font-weight:700;
    border-radius:4px;padding:1px 6px;margin-right:6px;}
  .nb-opt .lead{font-size:13.5px;font-weight:700;margin-bottom:10px;}
  .nb-chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .nb-chip{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:12px;color:var(--gray-500);}
  .nb-chip.on{border-color:var(--green);color:var(--green-deep);font-weight:700;}
  .nb-fake-field{display:flex;gap:10px;font-size:12px;color:var(--gray-500);margin-bottom:10px;flex-wrap:wrap;}
  .nb-notes{font-size:12px;color:var(--gray-500);line-height:2;max-width:620px;margin:20px auto 0;}
  .nb-cta{max-width:620px;margin:22px auto 0;display:flex;flex-direction:column;gap:10px;}
  .nb-cta button{
    border:none;border-radius:10px;padding:15px;color:#fff;font-size:14px;font-weight:700;
    display:flex;align-items:center;justify-content:space-between;padding-left:20px;padding-right:20px;
  }
  .nb-cta button.g{background:var(--green);}
  .nb-cta button.p{background:var(--purple);}
  .nb-toast{
    max-width:620px;margin:14px auto 0;background:var(--alert-tint);color:#C81E2C;
    border-radius:8px;padding:10px 14px;font-size:12.5px;text-align:center;display:none;
  }
  .nb-toast.show{display:block;}

  /* ===================== BIZ DETAIL (dark sidebar, matches real SmartPlace) ===================== */
  .biz-layout{display:grid;grid-template-columns:220px 1fr;gap:0;max-width:1240px;margin:0 auto;align-items:start;}
  .biz-sidebar{background:#1C1C1E;padding:20px 14px 24px;align-self:stretch;}
  .biz-sidebar .biz-head{
    display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:#fff;padding:6px 8px 18px;
    border-bottom:1px solid #333;margin-bottom:10px;
  }
  .biz-sidebar .biz-head .thumb{width:26px;height:26px;border-radius:6px;background:#3a3a3c;flex-shrink:0;}
  .biz-nav-item{
    padding:11px 10px;border-radius:8px;font-size:13.5px;color:#B0B0B3;
    display:flex;align-items:center;gap:10px;margin-bottom:2px;
  }
  .biz-nav-item .nav-ic{width:18px;flex-shrink:0;text-align:center;font-size:13px;}
  .biz-nav-item .nav-badge{background:#fff;color:#1C1C1E;font-size:9px;font-weight:800;padding:1.5px 6px;border-radius:8px;margin-left:auto;}
  .biz-nav-item.active{background:none;color:#fff;font-weight:700;}
  .biz-nav-item.inquiry-toggle{border-top:1px solid #333;margin-top:10px;padding-top:16px;color:#B0B0B3;}
  .biz-nav-item.inquiry-toggle .chev{margin-left:auto;font-size:9px;color:#7a7a7c;}
  .inquiry-sub{padding:2px 0 10px 32px;}
  .inquiry-item{padding:9px 6px;font-size:12.5px;color:#9a9a9c;cursor:pointer;}
  .inquiry-item.sel{color:var(--green);font-weight:700;}
  .inquiry-item:hover{color:#fff;}
  .biz-sidebar-foot{margin-top:18px;padding-top:14px;border-top:1px solid #333;display:flex;gap:14px;font-size:11.5px;color:#7a7a7c;}
  .biz-main{padding:0 0 60px;min-width:0;}
  .sol-section{margin-bottom:32px;}
  .sol-section h3{font-size:16px;font-weight:800;margin-bottom:16px;color:var(--ink);}
  .sol-card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
  .sol-card{border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;gap:18px;align-items:flex-start;}
  .sol-card-icon{width:56px;height:56px;border-radius:12px;background:var(--surface);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:24px;}
  .sol-card-title{font-size:15.5px;font-weight:800;margin-bottom:4px;color:var(--ink);}
  .sol-card-sub{font-size:12.5px;color:var(--gray-500);margin-bottom:12px;}
  .sol-detail-btn{display:inline-block;background:var(--surface);color:var(--gray-700);border-radius:7px;
    padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .sol-inuse-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
  .sol-inuse-card{border:1px solid var(--line);border-radius:12px;padding:22px;}
  .sol-inuse-top{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
  .sol-inuse-icon{width:46px;height:46px;border-radius:10px;color:#fff;display:flex;align-items:center;
    justify-content:center;font-size:18px;font-weight:800;flex-shrink:0;}
  .sol-inuse-name{font-size:15.5px;font-weight:800;color:var(--ink);}
  .sol-badge{display:inline-block;background:var(--green-tint);color:var(--green-deep);font-size:11px;
    font-weight:700;padding:3px 9px;border-radius:6px;margin-top:4px;}
  .sol-inuse-body{font-size:13px;color:var(--gray-700);margin-bottom:14px;line-height:1.6;}
  .sol-inuse-btn{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:11px;
    text-align:center;font-size:13px;font-weight:700;color:var(--gray-700);cursor:pointer;}
  @media (max-width:700px){ .sol-card-grid, .sol-inuse-grid{grid-template-columns:1fr;} }
  .book-card{display:flex;align-items:center;gap:24px;border:1px solid var(--line);border-radius:12px;
    padding:24px;margin-bottom:20px;}
  .book-card .icon{width:90px;height:90px;border-radius:12px;overflow:hidden;flex-shrink:0;background:var(--surface);}
  .book-card .icon img{width:100%;height:100%;object-fit:cover;}
  .book-card .body{flex:1;}
  .book-card .t{font-size:19px;font-weight:800;color:var(--ink);margin-bottom:4px;}
  .book-card .sub{font-size:13px;color:var(--gray-500);margin-bottom:10px;}
  .book-card .tag{display:inline-block;background:var(--green-tint);color:var(--green-deep);font-size:12px;
    font-weight:700;padding:5px 12px;border-radius:16px;}
  .book-card .cta{flex-shrink:0;background:#1C1C1E;color:#fff;border:none;border-radius:9px;
    padding:14px 22px;font-size:14px;font-weight:700;cursor:pointer;}

  /* ============= 쿠폰 (coupon) pages ============= */
  .cp-tabs{display:flex;gap:28px;padding:18px 28px 0;border-bottom:1px solid var(--line);}
  .cp-tab{padding-bottom:14px;font-size:16px;color:var(--gray-500);border-bottom:2px solid transparent;cursor:pointer;}
  .cp-tab.active{color:var(--ink);font-weight:800;border-color:var(--ink);}
  .cp-wrap{padding:28px;max-width:1080px;}
  .cp-intro-card{display:flex;gap:36px;align-items:flex-start;margin-bottom:28px;}
  .cp-icon-box{width:220px;height:220px;border-radius:16px;background:linear-gradient(135deg,#3FBF8F,#1E9C74);
    flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800;
    position:relative;overflow:hidden;}
  .cp-intro-title{font-size:30px;font-weight:800;color:var(--ink);margin-bottom:12px;}
  .cp-intro-desc{font-size:15px;color:var(--gray-700);margin-bottom:22px;line-height:1.6;}
  .cp-new-btn{display:inline-block;background:#1C1C1E;color:#fff;border:none;border-radius:9px;
    padding:14px 22px;font-size:14.5px;font-weight:700;cursor:pointer;}
  .cp-meta-row{display:flex;gap:60px;padding:22px 0;border-top:1px solid var(--line);margin-bottom:22px;}
  .cp-meta-col h5{font-size:12.5px;color:var(--gray-500);font-weight:700;margin:0 0 8px;}
  .cp-meta-col div{font-size:14.5px;color:var(--ink);font-weight:600;}
  .cp-feature-title{font-size:20px;font-weight:800;color:var(--ink);margin-bottom:14px;}
  .cp-feature-desc{font-size:13.5px;color:var(--gray-700);line-height:1.75;margin-bottom:24px;}
  .cp-feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .cp-feature-box{background:var(--surface);border-radius:12px;padding:22px;}
  .cp-feature-num{font-size:22px;font-weight:800;color:var(--green-deep);margin-bottom:10px;}
  .cp-feature-box p{font-size:13.5px;color:var(--gray-700);line-height:1.6;margin:0;}
  .cp-list-item{border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:14px;
    display:flex;justify-content:space-between;align-items:center;}
  .cp-list-item .name{font-size:16px;font-weight:800;color:var(--ink);margin-bottom:5px;}
  .cp-list-item .sub{font-size:12.5px;color:var(--gray-500);}
  .cp-list-item .del{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 14px;font-size:12.5px;color:var(--gray-500);cursor:pointer;}
  .cp-empty{text-align:center;padding:60px 0;color:var(--gray-300);font-size:14px;}

  .cp-create-head{display:flex;align-items:center;gap:14px;margin-bottom:24px;}
  .cp-back{font-size:20px;color:var(--gray-500);cursor:pointer;}
  .cp-create-title{font-size:24px;font-weight:800;color:var(--ink);}
  .cp-section{border:1px solid var(--line);border-radius:12px;padding:26px;margin-bottom:20px;}
  .cp-q{font-size:16px;font-weight:800;color:var(--ink);margin-bottom:18px;}
  .cp-q .req{color:var(--alert);font-size:12px;margin-left:2px;}
  .cp-type-row{display:flex;gap:14px;margin-bottom:16px;}
  .cp-type-btn{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:20px;text-align:center;
    font-size:15px;font-weight:700;color:var(--gray-700);cursor:pointer;display:flex;align-items:center;
    justify-content:center;gap:10px;}
  .cp-type-btn .ic{width:26px;height:26px;border-radius:50%;background:var(--surface);display:flex;
    align-items:center;justify-content:center;font-size:13px;}
  .cp-type-btn.sel{border-color:var(--green);color:var(--green-deep);background:var(--green-tint);}
  .cp-mode-row{display:flex;gap:10px;align-items:center;margin-bottom:8px;}
  .cp-mode-btn{border:1.5px solid var(--line);border-radius:8px;padding:12px 20px;font-size:14px;font-weight:700;
    color:var(--gray-500);cursor:pointer;}
  .cp-mode-btn.sel{border-color:var(--ink);color:var(--ink);border-width:2px;}
  .cp-amount-box{flex:1;position:relative;}
  .cp-amount-box input{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14.5px;}
  .cp-amount-box input.invalid{border-color:var(--alert);background:var(--alert-tint);}
  .cp-unit{font-size:14px;color:var(--gray-700);white-space:nowrap;}
  .cp-required-note{color:var(--alert);font-size:12px;margin-top:6px;}
  .cp-maxcap-row{display:flex;align-items:center;gap:10px;margin-top:14px;}
  .cp-checkbox{width:20px;height:20px;border:1.5px solid var(--line);border-radius:5px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0;}
  .cp-checkbox.on{background:var(--green);border-color:var(--green);}
  .cp-target-row{display:flex;gap:14px;flex-wrap:wrap;}
  .cp-target-btn{flex:1;min-width:220px;border:1.5px solid var(--line);border-radius:10px;padding:16px;
    text-align:center;font-size:14.5px;font-weight:700;color:var(--gray-700);cursor:pointer;}
  .cp-target-btn.sel{border-color:var(--green);color:var(--green-deep);background:var(--green-tint);}
  .cp-target-btn.disabled{color:var(--gray-300);cursor:default;background:var(--surface);}
  .cp-target-note{font-size:12px;color:var(--gray-500);margin-top:12px;line-height:1.7;}
  .cp-target-note a{color:var(--green-deep);}
  .cp-btn-row{display:flex;gap:10px;margin-top:6px;}
  .cp-btn-cancel{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:15px;
    font-size:15px;font-weight:700;color:var(--gray-700);cursor:pointer;}
  .cp-btn-submit{flex:1;border:none;background:var(--green);border-radius:10px;padding:15px;
    font-size:15px;font-weight:700;color:#fff;cursor:pointer;}

  .cp-preview{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:sticky;top:24px;}
  .cp-preview-label{font-size:14px;font-weight:800;color:var(--ink);padding:18px 20px 0;}
  .cp-preview-top{margin:16px 20px;border-radius:10px;padding:16px 18px;background:var(--surface);
    color:var(--gray-500);font-size:13px;line-height:1.7;transition:background .2s,color .2s;}
  .cp-preview-top.filled{background:var(--green);color:#fff;}
  .cp-preview-benefit{display:flex;align-items:center;gap:12px;margin:0 20px 14px;}
  .cp-preview-benefit .ic{width:36px;height:36px;border-radius:50%;background:var(--green-tint);
    display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--green-deep);flex-shrink:0;}
  .cp-preview-benefit .txt{font-size:14px;font-weight:700;color:var(--ink);}
  .cp-preview-list{border-top:1px dashed var(--line);margin:0 20px;padding:10px 0 18px;}
  .cp-preview-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;}
  .cp-preview-row .k{color:var(--gray-700);font-weight:600;}
  .cp-preview-row .v{color:var(--gray-500);}
  .cp-preview-row .v.set{color:var(--green-deep);font-weight:700;}
  .biz-hero{
    position:relative;height:230px;background:linear-gradient(135deg,#cfd6da,#e7ebed);
    display:flex;flex-direction:column;justify-content:flex-end;padding:22px 28px;color:#fff;
  }
  .biz-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.45),rgba(0,0,0,0) 60%);}
  .biz-hero > *{position:relative;z-index:1;}

<body>
<div class="practice-flag">실습 환경 · 실제 서비스 아님</div>
<div id="app"></div>

<script>
/* ============================================================
   GLOBAL STATE
============================================================ */
let userName = localStorage.getItem('placeSimUser') || "";
let view = userName ? 'dashboard' : 'login';

function escapeHtml(str){
  return (str||"").replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function goto(v){ view = v; render(); window.scrollTo({top:0}); }

function render(){
  const app = document.getElementById('app');
  if(view === 'login') app.innerHTML = viewLogin();
  else if(view === 'dashboard') app.innerHTML = viewDashboard();
  else if(view === 'newbiz') app.innerHTML = viewNewBiz();
  else if(view === 'bizdetail') app.innerHTML = viewBizDetail();
  else if(view === 'wizard') { app.innerHTML = viewWizardShell(); initWizard(); }
  else if(view === 'solutions') { app.innerHTML = viewSolutions(); initSolutions(); }
  else if(view === 'booking') { app.innerHTML = viewBooking(); }
  else if(view === 'couponhome') { app.innerHTML = viewCouponHome(); }
  else if(view === 'couponcreate') { app.innerHTML = viewCouponCreate(); initCouponCreate(); }
}

/* ============================================================
   LOGIN VIEW
============================================================ */
function viewLogin(){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-badge">P</div>
      <h1 class="login-title">플레이스 실습 로그인</h1>
      <p class="login-sub">강의용 연습 계정입니다. 이름을 입력하면<br/>내 이름으로 된 업체를 실습해볼 수 있어요.</p>
      <div class="login-field">
        <label>이름</label>
        <input type="text" id="loginName" placeholder="이름을 입력해주세요" onkeydown="if(event.key==='Enter')doLogin()"/>
      </div>
      <button class="login-btn" id="loginBtn" onclick="doLogin()">로그인</button>
      <div class="login-foot">© 실습용 시뮬레이터 — 실제 네이버 서비스와 무관합니다</div>
    </div>
  </div>`;
}
function doLogin(){
  const v = document.getElementById('loginName').value.trim();
  if(!v){ document.getElementById('loginName').focus(); return; }
  userName = v;
  localStorage.setItem('placeSimUser', v);
  goto('dashboard');
}
function doLogout(){
  localStorage.removeItem('placeSimUser');
  userName = "";
  goto('login');
}

/* ============================================================
   TOP NAV (shared)
============================================================ */
function topNav(){
  return `
  <div class="topnav">
    <div class="tn-left">
      <div class="tn-logo"><span class="sq">N</span> SmartPlace</div>
      <div class="tn-menu">
        <span>광고주센터</span><span>톡톡</span><span>스마트스토어</span><span>페이</span><span>교육</span><span>마이비즈</span>
      </div>
    </div>
    <div class="tn-right">
      <span class="tn-user">${escapeHtml(userName)} 님</span>
      <span class="tn-logout" onclick="doLogout()">로그아웃</span>
    </div>
  </div>`;
}

/* ============================================================
   DASHBOARD VIEW
============================================================ */
function viewDashboard(){
  return `
  ${topNav()}
  <div class="page-wrap">
    <div class="hero">
      <div>
        <div class="hero-eyebrow">PLACE 실습</div>
        <div class="hero-title">오늘 배운 셋팅 원칙,<br/>내 업체에 바로 적용해보세요</div>
        <div class="hero-link">자세히 보기 ›</div>
      </div>
      <div class="hero-visual">미리보기</div>
    </div>

    <div class="quick-icons">
      <div class="qi-card" onclick="goto('newbiz')"><div class="qi-icon">＋</div>업체 신규 등록</div>
      <div class="qi-card"><div class="qi-icon">🔍</div>업체 찾기</div>
      <div class="qi-card"><div class="qi-icon">✓</div>예약/주문</div>
      <div class="qi-card"><div class="qi-icon">🏷</div>브랜드 관리</div>
      <div class="qi-card"><div class="qi-icon">?</div>FAQ 도움말</div>
    </div>

    <div class="ad-strip">
      <span>실습용 배너 영역입니다</span>
      <button>더 알아보기</button>
    </div>

    <div class="mybiz-title">내 업체 <span>1</span> ›</div>
    <div class="mybiz-card" onclick="goto('bizdetail')">
      <div class="mybiz-thumb"></div>
      <div class="mybiz-name">${escapeHtml(userName)}</div>
      <div class="mybiz-chev">›</div>
    </div>
  </div>`;
}

/* ============================================================
   NEW BIZ (dead-end) VIEW
============================================================ */
function viewNewBiz(){
  return `
  ${topNav()}
  <div class="page-wrap">
    <div class="nb-back" onclick="goto('dashboard')">← 뒤로</div>
    <div class="nb-title">업종을 알려주세요.</div>

      <input type="text" placeholder="업종 또는 단체의 분류를 입력해주세요" disabled/>
      <span class="ic">🔍</span>

      <h3>업종?</h3>

      <div class="nb-opt">
        <div class="lead"><span class="num">1</span>사업자등록증에 기재된 "종목"으로 하기</div>
        <div class="nb-fake-field">개업 년월일</div>
        <div class="nb-fake-field">사업장 소재지</div>
        <div class="nb-fake-field">사업의 종류
          <span class="nb-chip">업태</span><span class="nb-chip on">종목 한식</span>
        </div>
      </div>
      <div class="nb-opt">
        <div class="lead"><span class="num">2</span>업체를 "대표할 수 있는 키워드"로 검색해보기</div>
        <div class="nb-chip-row">
          <span style="font-size:12px;color:var(--gray-500);margin-right:4px;">예시 키워드</span>
          <span class="nb-chip">펜션</span><span class="nb-chip">한의원</span><span class="nb-chip">치킨</span><span class="nb-chip">서점</span><span class="nb-chip">등</span>
        </div>
      </div>
    </div>
    <div class="nb-notes">
      · 등록 중에는 업종을 변경하실 수 없습니다.<br/>
      · 등록 완료 이후에는 업종 변경이 가능합니다.<br/>
      · 검색결과에 영향을 미칠 수 있으니, 가장 적합한 업종을 선택해주세요.<br/>

    <div class="nb-toast" id="nbToast">실습에서는 여기까지만 제공돼요. 실제 등록은 사업자 서류 인증이 필요한 단계라 별도로 진행합니다.</div>
  </div>`;
}
function showNbToast(){ document.getElementById('nbToast').classList.add('show'); }

const NAV_ITEMS = ["업체정보","예약·주문","스마트콜","마케팅","리뷰","고객","통계","비즈니스 스쿨","금융지원","솔루션"];
const NAV_ICONS = {"업체정보":"ℹ️","예약·주문":"🗓️","스마트콜":"📞","마케팅":"🗂️","리뷰":"✏️","고객":"👥","통계":"📊","비즈니스 스쿨":"🪜","금융지원":"🏦","솔루션":"⚙️"};
const NAV_LINKS = {"비즈니스 스쿨":"https://bizschool.naver.com/online/courses/4"};
const NAV_BADGES = {"솔루션":"NEW"};
const MARKETING_SUB = ["쿠폰","마케팅메시지","플레이스광고","지역소상공인광고","옥외광고"];
let inquiryOpen = false;
let marketingOpen = false;
function wzSidebarClick(i){
  const name = NAV_ITEMS[i];
  if(name==='업체정보') goto('bizdetail');
  else if(name==='예약·주문') goto('booking');
  else if(name==='마케팅'){ marketingOpen = !marketingOpen; render(); }
  else if(name==='솔루션') goto('solutions');
  else if(NAV_LINKS[name]) window.open(NAV_LINKS[name], '_blank');
  else alert('실습에서는 지원하지 않아요');
}
function wzMarketingSubClick(sub){
  if(sub==='쿠폰') goto('couponhome');
  else alert('실습에서는 지원하지 않아요');
}
function toggleInquiry(){ inquiryOpen = !inquiryOpen; render(); }
function sidebarNav(activeIndex){
  const onCoupon = (view==='couponhome' || view==='couponcreate');
  const mktExpanded = marketingOpen || onCoupon;
  return `
  <div class="biz-sidebar">
    <div class="biz-head"><span class="thumb"></span>${escapeHtml(userName)} ›</div>
    ${NAV_ITEMS.map((n,i)=>{
      if(n==='마케팅'){
        return `<div class="biz-nav-item ${mktExpanded?'active':''}" onclick="wzSidebarClick(${i})"><span class="nav-ic">${NAV_ICONS[n]}</span>${n}</div>
        ${mktExpanded ? `<div class="inquiry-sub">${MARKETING_SUB.map(sub=>`<div class="inquiry-item ${sub==='쿠폰'&&onCoupon?'sel':''}" onclick="wzMarketingSubClick('${sub}')">${sub}</div>`).join("")}</div>` : ``}`;
      }
      return `<div class="biz-nav-item ${i===activeIndex?'active':''}" onclick="wzSidebarClick(${i})"><span class="nav-ic">${NAV_ICONS[n]||''}</span>${n}${NAV_BADGES[n] ? `<span class="nav-badge">${NAV_BADGES[n]}</span>` : ``}</div>`;
    }).join("")}
    <div class="biz-nav-item inquiry-toggle" onclick="toggleInquiry()">
      <span class="nav-ic">💬</span>문의 채널 <span class="chev">${inquiryOpen?'▲':'▼'}</span>
    </div>
    ${inquiryOpen ? `
    <div class="inquiry-sub">
      <div class="inquiry-item" onclick="window.open('https://help.naver.com/service/30026/category/bookmark?lang=ko','_blank')">사업주 고객센터</div>
      <div class="inquiry-item" onclick="alert('실습에서는 지원하지 않아요')">예약·주문 톡톡상담</div>

function viewBooking(){
  const cards = [
    { icon: SOL_ICONS.booking, t: "온라인으로 예약 받기", sub: "네이버 예약", cta: "예약 시작하기" },
    { icon: SOL_ICONS.npay, t: "온라인으로 주문 받기", sub: "네이버 주문", cta: "주문 시작하기" },
    { icon: SOL_ICONS.program, t: "프로그램 운영하기", sub: "네이버 프로그램", cta: "프로그램 시작하기" },
  ];
  return `
  ${topNav()}
  <div class="biz-layout">
    ${sidebarNav(NAV_ITEMS.indexOf('예약·주문'))}
    <div class="biz-main" style="padding:26px 28px 60px;">
      <div style="font-size:24px;font-weight:800;color:var(--ink);line-height:1.5;margin-bottom:26px;">
        매장 운영을 더 원활하게!<br/>네이버 <span style="color:var(--green-deep);">예약·주문</span>을 사용해보세요.

      ${cards.map(c => `
        <div class="book-card">
          <div class="icon"><img src="${c.icon}"/></div>
          <div class="body">
            <div class="t">${c.t}</div>
            <div class="sub">${c.sub}</div>
            <div class="tag">자세히</div>
          </div>
          <button class="cta" onclick="alert('실습에서는 지원하지 않아요')">${c.cta} ›</button>
        </div>`).join("")}
    </div>
  </div>`;
}

function chipGroup(options, selectedArr, toggleFnName){
  return `<div class="opt-chip-grid">${options.map(o=>`
    <div class="opt-chip ${selectedArr.includes(o)?'sel':''}" onclick="${toggleFnName}('${o.replace(/'/g,"\\'")}')">${o}</div>
  `).join("")}</div>`;
}
function toggle2(curVal, valA, labelA, valB, labelB, fnName){
  return `<div class="toggle2-row">
    <div class="toggle2-btn ${curVal===valA?'sel':''}" onclick="${fnName}('${valA}')">${labelA}</div>
    <div class="toggle2-btn ${curVal===valB?'sel':''}" onclick="${fnName}('${valB}')">${labelB}</div>
  </div>`;
}

function wzOnPetDetail(v){ wz.petDetail = v.slice(0,200); wzRenderPreview(); }
function wzSetNoKids(v){ wz.noKidsZone = wz.noKidsZone===v ? null : v; wzRenderForm(); wzRenderPreview(); }
function wzSetParkingAvail(v){ wz.parkingAvail = wz.parkingAvail===v ? null : v; if(wz.parkingAvail!=='yes') wz.parkingFee=null; wzRenderForm(); wzRenderPreview(); }
function wzSetParkingFee(v){ wz.parkingFee = wz.parkingFee===v ? null : v; wzRenderForm(); wzRenderPreview(); }
function wzSetValetAvail(v){ wz.valetAvail = wz.valetAvail===v ? null : v; if(wz.valetAvail!=='yes'){ wz.valetFee=null; wz.valetPrice=""; } wzRenderForm(); wzRenderPreview(); }
function wzSetValetFee(v){ wz.valetFee = wz.valetFee===v ? null : v; if(wz.valetFee!=='paid') wz.valetPrice=""; wzRenderForm(); wzRenderPreview(); }
function wzOnValetPrice(v){ wz.valetPrice=v; wzRenderPreview(); }
function wzSetNearbyParking(v){ wz.nearbyParkingAvail = wz.nearbyParkingAvail===v ? null : v; wzRenderForm(); wzRenderPreview(); }
function wzOnParkingDetail(v){ wz.parkingDetail = v.slice(0,400); wzRenderPreview(); }

/* ---------------- CHARSET GUARD (Naver-style disallowed character warning) ---------------- */
const CHARSET_REGEX = /^[-_():&!\[\],.%+~@*^'\/?²°C※<>a-zA-Z0-9가-힣ㄱ-ㅎㅏ-ㅣ\u4E00-\u9FFF\u3040-\u30FF\s]*$/;
const CHARSET_MSG = "한글, 영문, 한자, 일본어, 숫자, 특수문자(-_():&![],.%+~@*^'/?²°C※<>)만 입력 가능합니다.";
function wzCharsetGuard(el){
  const valid = CHARSET_REGEX.test(el.value);
  const next = el.nextElementSibling;
  const hasWarn = next && next.classList && next.classList.contains('charset-warn');
  if(!valid){
    el.classList.add('invalid');
    if(!hasWarn) el.insertAdjacentHTML('afterend', `<div class="charset-warn">${CHARSET_MSG}</div>`);
  } else {
    el.classList.remove('invalid');
    if(hasWarn) next.remove();
  }
}

/* ---------------- FEEDBACK (warnings/ok chips) ---------------- */
function wzUpdateFeedback(){
  const nameCount = document.getElementById('wzNameCount'); if(nameCount) nameCount.textContent = wz.name.length;
  const engCount = document.getElementById('wzEngCount'); if(engCount) engCount.textContent = wz.engName.length;
  const introCount = document.getElementById('wzIntroCount'); if(introCount) introCount.textContent = wz.intro.length;
  const wayCount = document.getElementById('wzWayCount'); if(wayCount) wayCount.textContent = wz.way.length;

  const nw=document.getElementById('wzNameWarn'), no=document.getElementById('wzNameOk');
  if(nw){
    if(wz.name && wzHasBanned(wz.name)){ nw.querySelector('span').textContent="이 표현은 사업자등록증·공식 서류로 증빙되지 않으면 반려될 수 있어요."; nw.classList.add('show'); no.classList.remove('show'); }
    else if(wz.name){ nw.classList.remove('show'); no.classList.add('show'); }
    else { nw.classList.remove('show'); no.classList.remove('show'); }
  }
  const ww=document.getElementById('wzWayWarn');
  if(ww){
    const words = wz.way.split(/\s+/).filter(Boolean); const freq={};
    words.forEach(x=>{ if(x.length>=2) freq[x]=(freq[x]||0)+1; });
    const rep = Object.keys(freq).find(x=>freq[x]>=3);
    if(rep){ ww.querySelector('span').textContent = `"${rep}"가 반복되고 있어요. 이 영역은 업종 키워드가 아닌 위치 정보 중심으로 작성해보세요.`; ww.classList.add('show'); }
    else ww.classList.remove('show');
  }
  const iw=document.getElementById('wzIntroWarn'), io=document.getElementById('wzIntroOk');
  if(iw){
    if(wz.intro && wzIsCommaHeavy(wz.intro)){ iw.querySelector('span').textContent="쉼표로 나열된 낱말은 AI가 읽기 어렵습니다. 문장형으로 다시 써보세요."; iw.classList.add('show'); io.classList.remove('show'); }
    else if(wz.intro.length>=20){ iw.classList.remove('show'); io.classList.add('show'); }
    else { iw.classList.remove('show'); io.classList.remove('show'); }
  }
  const pw=document.getElementById('wzPhotoWarn'), po=document.getElementById('wzPhotoOk');
  if(pw){
    const filled = wz.photos.length;
    if(filled>0 && filled<5){ pw.querySelector('span').textContent = `현재 ${filled}장 채워졌어요. 5장 이상 채우면 노출에 더 유리합니다.`; pw.classList.add('show'); po.classList.remove('show'); }
    else if(filled>=5){ pw.classList.remove('show'); po.classList.add('show'); }
    else { pw.classList.remove('show'); po.classList.remove('show'); }
  }
}

function wzGetHoursForDay(dayKey){
  if(wz.regularClosedDays.includes(dayKey)) return null;
  if(wz.hoursMode==='all') return wz.hoursAll;
  if(wz.hoursMode==='weekday_weekend') return (dayKey==='토'||dayKey==='일') ? wz.hoursWeekend : wz.hoursWeekday;
  return wz.hoursByDay[dayKey];
}
function wzTodayDayKey(){
  const map = ['일','월','화','수','목','금','토'];
  return map[new Date().getDay()];
}
function wzComputeStatusLine(){
  if(wz.hasHoliday===null) return null;
  const dayKey = wzTodayDayKey();
  const hrs = wzGetHoursForDay(dayKey);
  if(!hrs) return `정기휴무 (${dayKey}요일)`;
  const now = new Date();
  const nowMin = now.getHours()*60+now.getMinutes();
  const [oh,om] = hrs.open.split(':').map(Number);
  const [ch,cm] = hrs.close.split(':').map(Number);
  const openMin = oh*60+om, closeMin = ch*60+cm;
  const isOpen = nowMin>=openMin && nowMin<closeMin;
  return isOpen ? `영업 중 · ${hrs.close}에 영업 종료` : `영업 종료 · ${hrs.open}에 영업 시작`;
}

function wzOpenPriceModal(){ wz.priceModalOpen=true; wz.priceModalVariable=false; wz.priceModalName=""; wzRenderForm(); setTimeout(()=>{ const el=document.getElementById('wz-modal-name'); if(el) el.focus(); },0); }
function wzClosePriceModal(){ wz.priceModalOpen=false; wzRenderForm(); }
function wzToggleModalVariable(){ wz.priceModalVariable = !wz.priceModalVariable; wzRenderForm(); }
function wzSubmitPriceModal(){
  const nameEl = document.getElementById('wz-modal-name');
  const name = nameEl.value.trim();
  if(!name){ nameEl.focus(); return; }
  let price = "";
  if(!wz.priceModalVariable){
    const priceEl = document.getElementById('wz-modal-price');
    price = priceEl.value.trim();
    if(!price){ priceEl.focus(); return; }
  }
  wz.menuItems.push({name, price});
  wz.priceModalOpen = false;
  wz.priceModalName = "";
  wzRenderForm();
  wzRenderPreview();
}
function wzRemoveMenuItem(i){ wz.menuItems.splice(i,1); wzRenderMenuList(); wzRenderPreview(); }
function wzRenderMenuList(){
  const box = document.getElementById('wzMenuList'); if(!box) return;
  if(!wz.menuItems.length){ box.innerHTML = `<div class="ph-empty" style="padding:14px 2px;">아직 등록된 가격정보가 없습니다.</div>`; return; }
  box.innerHTML = wz.menuItems.map((m,i)=>`
    <div class="price-list-item">
      <div>
        <div class="pname">${escapeHtml(m.name)}</div>
        <div class="pprice ${m.price?'set':''}">${m.price ? formatWon(m.price) : '변동가격'}</div>
      </div>
      <span class="x" onclick="wzRemoveMenuItem(${i})">✕</span>
    </div>`).join("");
}
function wzRenderPriceImageGrid(){
  const grid = document.getElementById('wzPriceImgGrid'); if(!grid) return;
  grid.innerHTML = "";
  const addCell = document.createElement('div');
  addCell.className = 'photo-slot-lg';
  addCell.innerHTML = `<div>＋</div><div>사진추가<br/>드래그 가능</div>`;
  addCell.onclick = wzPickPriceImage;
  grid.appendChild(addCell);
  wz.priceImages.forEach((p,i)=>{
    const cell = document.createElement('div');
    cell.className = 'photo-slot-lg';
    cell.innerHTML = `<img src="${p}"/><div class="num" style="position:absolute;top:5px;right:5px;background:rgba(255,255,255,.85);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;">✕</div>`;
    cell.querySelector('.num').onclick = (e)=>{ e.stopPropagation(); wz.priceImages.splice(i,1); wzRenderPriceImageGrid(); };
    grid.appendChild(cell);
  });
}
function wzPickPriceImage(){
  if(wz.priceImages.length>=10) return;
  const input = document.createElement('input');
  input.type='file'; input.accept='image/*';
  input.onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{ wz.priceImages.push(ev.target.result); wzRenderPriceImageGrid(); };
    reader.readAsDataURL(file);
  };
  input.click();
}

/* ---------------- PHOTOS ---------------- */
function wzRenderPhotoGrid(){
  const grid = document.getElementById('wzPhotoGrid'); if(!grid) return;
  grid.innerHTML = "";
  const addCell = document.createElement('div');
  addCell.className = 'photo-slot-lg';
  addCell.innerHTML = `<div>＋</div><div>사진추가<br/>드래그 가능</div>`;
  addCell.onclick = wzPickPhoto;
  grid.appendChild(addCell);

  wz.photos.forEach((p,i)=>{
    const cell = document.createElement('div');
    cell.className = 'photo-slot-lg';
    cell.innerHTML = `<img src="${p}"/>${i===0?'<div class="badge">대표</div>':''}<div class="num" style="position:absolute;top:5px;right:5px;background:rgba(255,255,255,.85);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;">✕</div>`;
    cell.querySelector('.num').onclick = (e)=>{ e.stopPropagation(); wz.photos.splice(i,1); wzRenderPhotoGrid(); wzUpdateFeedback(); wzRenderPreview(); };
    grid.appendChild(cell);
  });
}
function wzPickPhoto(){
  if(wz.photos.length>=10) return;
  const input = document.createElement('input');
  input.type='file'; input.accept='image/*';
  input.onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{ wz.photos.push(ev.target.result); wzRenderPhotoGrid(); wzUpdateFeedback(); wzRenderPreview(); };
    reader.readAsDataURL(file);
  };
  input.click();
}

/* ---------------- PHONE PREVIEW ---------------- */
let wzPreviewTab = 'home';
function wzSetTab(t){ wzPreviewTab = t; wzRenderPreview(); }

const PH_TABS = [
  {id:'home', label:'홈'},
  {id:'news', label:'소식'},
  {id:'review', label:'리뷰'},
  {id:'photo', label:'사진'},
  {id:'map', label:'지도'},
  {id:'nearby', label:'주변'},
  {id:'info', label:'정보'},
];

function wzRenderPreview(){
  const screen = document.getElementById('wzPhone'); if(!screen) return;
  const introHtml = wz.intro ? wzHighlightAnchor(wz.intro) : `<span class="ph-empty">아직 작성된 소개글이 없습니다</span>`;
  const wayHtml = wz.way ? escapeHtml(wz.way) : `<span class="ph-empty">찾아오는 길 정보가 없습니다</span>`;
  const addrHtml = wz.addr1 ? `${escapeHtml(wz.addr1)}${wz.addr2 ? ' ' + escapeHtml(wz.addr2) : ''}` : `<span class="ph-empty">주소가 입력되지 않았습니다</span>`;
  const phoneHtml = wz.phoneNum ? `${wz.phoneCode}-${escapeHtml(wz.phoneNum)}` : `<span class="ph-empty">전화번호가 입력되지 않았습니다</span>`;
  const catHtml = wz.category ? escapeHtml(wz.category) : "업종 미입력";
  const hasPhone = wz.phoneNum.length > 0;
  const photoCount = wz.photos.length;

  // website / SNS links
  const mainLink = wz.links.find(l=>l.type==='일반') || wz.links[0];
  const otherLinks = wz.links.filter(l=>l!==mainLink);
  const websiteHtml = mainLink
    ? `<div class="maintext" style="color:#3B82F6;font-weight:400;font-size:12.5px;">${escapeHtml(mainLink.url)}</div>${otherLinks.length ? `<div class="links">${otherLinks.map(l=>escapeHtml(l.type)).join(' · ')}</div>` : ``}`
    : `<span class="ph-empty">정보 없음</span>`;

  // amenities tag aggregation
  const amenityTags = [...wz.facilities];
  if(wz.parkingAvail==='yes') amenityTags.push('주차');
  if(wz.valetAvail==='yes') amenityTags.push('발렛파킹');
  if(wz.petFriendly==='yes') amenityTags.push('반려동물 동반');
  if(wz.accessibility.length) amenityTags.push(...wz.accessibility);
  const amenityHtml = amenityTags.length
    ? amenityTags.map(t=>`<span class="ph-tag">${escapeHtml(t)}</span>`).join("")
    : `<span class="ph-empty">정보 없음</span>`;

  const carouselSlides = photoCount
    ? wz.photos.slice(0,4).map(p=>`<div class="slide"><img src="${p}"/></div>`).join("")
    : `<div class="slide">대표사진</div><div class="slide">사진을 등록해보세요</div>`;

  const actionBar = `
    <div class="ph-actionbar">
      <div class="pill">↑ 길찾기</div>
      <div class="pill">⇗ 공유</div>
      <div class="pill">🔔 알림받기</div>
    </div>`;

  const tabbarHtml = `
    <div class="ph-tabbar">
      ${PH_TABS.map(t=>`<span class="${t.id===wzPreviewTab?'active':''}" onclick="wzSetTab('${t.id}')">${t.label}</span>`).join("")}
    </div>`;

  let contentHtml = "";
  if(wzPreviewTab==='home'){
    contentHtml = `
      <div class="ph-row">
        <div class="ic">📍</div>
        <div class="body"><div class="maintext">${addrHtml}</div><div class="links">지도 · 내비게이션 · 거리뷰</div></div>
      </div>
      <div class="ph-row">
        <div class="ic">🚇</div>
        <div class="body"><span class="ph-empty">정보 없음</span></div>
      </div>
      <div class="ph-row">
        <div class="ic">↗</div>
        <div class="body"><div class="ph-intro-preview">${wayHtml}</div></div>
      </div>
      <div class="ph-row">
        <div class="ic">☎</div>
        <div class="body">${phoneHtml}${hasPhone ? ` <span style="color:#3B82F6;">· 복사</span>` : ``}</div>
      </div>
      <div class="ph-row">
        <div class="ic">₩</div>
        <div class="body">${wz.menuItems.length ? wz.menuItems.map(m=>`<div class="ph-price-row"><span>${escapeHtml(m.name)}</span><span class="amt">${m.price?formatWon(m.price):'변동'}</span></div>`).join("") : ``}</div>
      </div>
      <div class="ph-row">
        <div class="ic">🌐</div>
        <div class="body">${websiteHtml}</div>
      </div>
      <div class="ph-row" style="border-bottom:none;">
        <div class="ic">🏬</div>
        <div class="body">${amenityHtml}</div>
      </div>`;
  }
  else if(wzPreviewTab==='news'){
    contentHtml = `
      <div class="ph-newscard"><div class="thumb"></div><div><div class="date">2026.08.24 <span class="ph-example-badge">예시</span></div>웰컴 오퍼 — 첫 방문 혜택 안내</div></div>
      <div class="ph-newscard"><div class="thumb"></div><div><div class="date">2026.07.02 <span class="ph-example-badge">예시</span></div>여름 시즌 프로그램 오픈</div></div>
      <div class="ph-newscard"><div class="thumb"></div><div><div class="date">2026.05.14 <span class="ph-example-badge">예시</span></div>신규 강사진 합류 소식</div></div>
      <div class="ph-tab-empty">소식은 예시 화면입니다.<br/>실습에서는 작성하지 않아요.</div>`;
  }
  else if(wzPreviewTab==='review'){
    const revs = [
      {n:"방문자***", s:"★★★★★", t:"시설이 깨끗하고 선생님이 꼼꼼하게 봐주셔서 좋았어요."},
      {n:"예약자***", s:"★★★★☆", t:"위치 찾기 쉽고 주차도 편했습니다."},
    ];
    contentHtml = `
      ${revs.map(r=>`
        <div class="ph-reviewcard">
          <div class="rtop"><div class="avatar"></div><div><div class="rname">${r.n}</div><div class="stars">${r.s}</div></div></div>
          <div class="rtext">${r.t}</div>
        </div>`).join("")}
      <div class="ph-tab-empty">리뷰는 예시 화면입니다.<br/>실습에서는 실제 리뷰가 쌓이지 않아요.</div>`;
  }
  else if(wzPreviewTab==='photo'){
    if(photoCount){
      contentHtml = `<div class="ph-photogrid">${wz.photos.map(p=>`<div><img src="${p}"/></div>`).join("")}</div>`;
    } else {
      contentHtml = `<div class="ph-tab-empty">아직 등록된 사진이 없습니다.<br/>대표 사진 단계에서 사진을 추가해보세요.</div>`;
    }
  }
  else if(wzPreviewTab==='map'){
    contentHtml = `<div class="ph-tab-empty">🗺️<br/><br/>지도 탭은 예시 화면이에요.<br/>실습에서는 지원하지 않습니다.</div>`;
  }
  else if(wzPreviewTab==='nearby'){
    contentHtml = `<div class="ph-tab-empty">📍<br/><br/>주변 탭은 예시 화면이에요.<br/>실습에서는 지원하지 않습니다.</div>`;
  }
  else if(wzPreviewTab==='info'){
    contentHtml = `
      <div class="ph-info-section"><h5>상호명</h5><div class="val">${wz.name ? escapeHtml(wz.name) : `<span class="ph-empty">미입력</span>`}</div></div>
      <div class="ph-info-section"><h5>업종</h5><div class="val">${catHtml}</div></div>
      <div class="ph-info-section"><h5>전화번호</h5><div class="val">${phoneHtml}</div></div>
      <div class="ph-info-section"><h5>주소</h5><div class="val">${addrHtml}</div></div>
      <div class="ph-info-section"><h5>찾아오는 길</h5><div class="val">${wayHtml}</div></div>
      <div class="ph-info-section"><h5>소개</h5><div class="val ph-intro-preview">${introHtml}</div></div>
      ${wz.keywords.length ? `<div class="ph-info-section"><h5>대표키워드</h5><div class="val">${wz.keywords.map(k=>`<span class="ph-tag">${escapeHtml(k)}</span>`).join("")}</div></div>` : ``}
      <div class="ph-info-section"><h5>메뉴/가격표</h5><div class="val">${wz.menuItems.length ? wz.menuItems.map(m=>`<div class="ph-price-row"><span>${escapeHtml(m.name)}</span><span class="amt">${m.price?formatWon(m.price):'변동'}</span></div>`).join("") : ``}</div></div>
      <div class="ph-info-section"><h5>제공 시설</h5><div class="val">${amenityHtml}</div></div>
      <div class="ph-info-section"><h5>반려동물 동반</h5><div class="val">${wz.petFriendly==='yes' ? `가능${wz.petDetail ? ' · '+escapeHtml(wz.petDetail) : ''}` : wz.petFriendly==='no' ? '불가' : `<span class="ph-empty">정보 없음</span>`}</div></div>
      <div class="ph-info-section"><h5>노키즈존</h5><div class="val">${wz.noKidsZone==='yes' ? '운영' : wz.noKidsZone==='none' ? '해당없음' : `<span class="ph-empty">정보 없음</span>`}</div></div>
      <div class="ph-info-section"><h5>주차</h5><div class="val">${wz.parkingAvail==='yes' ? `가능${wz.parkingFee?' · '+(wz.parkingFee==='paid'?'유료':'무료'):''}` : wz.parkingAvail==='no' ? '불가' : `<span class="ph-empty">정보 없음</span>`}</div></div>
      <div class="ph-info-section"><h5>발렛파킹</h5><div class="val">${wz.valetAvail==='yes' ? `가능${wz.valetFee?' · '+(wz.valetFee==='paid'?('유료'+(wz.valetPrice?' '+escapeHtml(wz.valetPrice):'')):'무료'):''}` : wz.valetAvail==='no' ? '불가' : `<span class="ph-empty">정보 없음</span>`}</div></div>
      ${wz.parkingDetail ? `<div class="ph-info-section"><h5>주차 상세 안내</h5><div class="val">${escapeHtml(wz.parkingDetail)}</div></div>` : ``}
      <div class="ph-info-section"><h5>결제수단</h5><div class="val">${wz.payment.length ? wz.payment.map(p=>`<span class="ph-tag">${escapeHtml(p)}</span>`).join("") : `<span class="ph-empty">정보 없음</span>`}</div></div>
      <div class="ph-info-section"><h5>홈페이지/SNS</h5><div class="val">${wz.links.length ? wz.links.map(l=>`<div style="margin-bottom:4px;">${escapeHtml(l.type)} · ${escapeHtml(l.url)}</div>`).join("") : `<span class="ph-empty">정보 없음</span>`}</div></div>
      <div class="ph-info-section" style="border-bottom:none;"><h5>영업시간</h5><div class="val">${wz.hasHoliday===null ? `<span class="ph-empty">정보 없음</span>` : DAY_LIST.map(d=>{
        const hrs = wzGetHoursForDay(d);
        return `<div class="ph-price-row"><span>${d}요일</span><span class="amt">${hrs ? hrs.open+' - '+hrs.close : '정기휴무'}</span></div>`;
      }).join("")}</div></div>`;
  }

  screen.innerHTML = `
    <div class="ph-topbar">
      <span class="back">‹</span>
      <span class="title">${wz.name ? escapeHtml(wz.name) : "상호명을 입력해보세요"}</span>
      <span class="star">☆</span>
    </div>
    <div class="ph-scroll">
      <div class="ph-title-block">
        <div class="pname">${wz.name ? escapeHtml(wz.name) : "상호명을 입력해보세요"}</div>
        <div class="pmeta">${catHtml} · 리뷰 0</div>
        <div class="pmeta">${wzComputeStatusLine() || `영업 중 · 22:00에 영업 종료 <span class="ph-placeholder-note">(예시)</span>`}</div>
      </div>
      ${actionBar}
      <div class="ph-carousel">${carouselSlides}</div>
      ${tabbarHtml}
      ${contentHtml}
    </div>`;
}
function wzHighlightAnchor(text){
  const esc = escapeHtml(text); const cut = Math.max(1, Math.round(esc.length*0.2));
  return `<span class="anchor">${esc.slice(0,cut)}</span>${esc.slice(cut)}`;
}

/* ============================================================
   INIT
============================================================ */
render();
</script>
