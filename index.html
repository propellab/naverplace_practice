<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>플레이스 실습 환경</title>
<style>
  :root{
    --green:#03C75A;
    --green-deep:#02A94C;
    --green-tint:#E9FBF1;
    --ink:#191919;
    --gray-700:#333D4B;
    --gray-500:#6B7684;
    --gray-300:#B0B8C1;
    --line:#E5E8EB;
    --surface:#F5F6F7;
    --white:#FFFFFF;
    --alert:#F04452;
    --alert-tint:#FDEBEC;
    --purple:#6C5CE7;
    --font: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font);color:var(--ink);background:var(--surface);-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  a{color:inherit;text-decoration:none;}

  /* ===================== practice badge (always visible) ===================== */
  .practice-flag{
    text-align:center;
    background:var(--ink); color:#fff; font-size:11.5px; font-weight:700;
    padding:6px 10px; letter-spacing:.02em;
  }

  /* ===================== LOGIN VIEW ===================== */
  .login-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--surface);
  }
  .login-card{
    width:380px; background:var(--white); border:1px solid var(--line);
    border-radius:16px; padding:40px 36px 32px; text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.06);
  }
  .login-badge{
    width:52px;height:52px;border-radius:14px;background:var(--green);
    color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;
    margin:0 auto 16px;
  }
  .login-title{font-size:19px;font-weight:800;margin:0 0 4px;}
  .login-sub{font-size:13px;color:var(--gray-500);margin:0 0 28px;line-height:1.5;}
  .login-field{text-align:left;margin-bottom:18px;}
  .login-field label{display:block;font-size:12.5px;font-weight:600;color:var(--gray-700);margin-bottom:7px;}
  .login-field input{
    width:100%;border:1.5px solid var(--line);border-radius:9px;
    padding:13px 14px;font-size:15px;outline:none;
  }
  .login-field input:focus{border-color:var(--green);}
  .login-btn{
    width:100%;background:var(--green);color:#fff;border:none;
    border-radius:9px;padding:13px;font-size:15px;font-weight:700;margin-top:4px;
  }
  .login-btn:hover{background:var(--green-deep);}
  .login-btn:disabled{background:var(--gray-300);cursor:default;}
  .login-foot{font-size:11.5px;color:var(--gray-300);margin-top:22px;}

  /* ===================== TOP NAV (dashboard/bizdetail) ===================== */
  .topnav{
    background:var(--white); border-bottom:1px solid var(--line);
    height:60px; display:flex; align-items:center; justify-content:space-between;
    padding:0 24px;
  }
  .tn-left{display:flex;align-items:center;gap:28px;}
  .tn-logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;color:var(--ink);}
  .tn-logo .sq{width:26px;height:26px;border-radius:6px;background:var(--green);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;}
  .tn-menu{display:flex;gap:22px;}
  .tn-menu span{font-size:13.5px;color:var(--gray-700);font-weight:500;}
  .tn-right{display:flex;align-items:center;gap:14px;}
  .tn-user{font-size:13px;font-weight:700;color:var(--green-deep);}
  .tn-logout{font-size:13px;color:var(--gray-500);border-left:1px solid var(--line);padding-left:14px;}
  .tn-logout:hover{color:var(--ink);}

  .page-wrap{max-width:1080px;margin:0 auto;padding:28px 24px 60px;}

  /* ===================== hero banner ===================== */
  .hero{
    background:linear-gradient(120deg,#8FE3C0,#B9EAD3);
    border-radius:14px; padding:36px 40px; margin-bottom:22px;
    display:flex; align-items:center; justify-content:space-between;
    min-height:160px;
  }
  .hero-eyebrow{font-size:13px;font-weight:700;color:#0E5A34;margin-bottom:8px;}
  .hero-title{font-size:22px;font-weight:800;color:#0B3D24;line-height:1.4;max-width:420px;}
  .hero-link{margin-top:12px;font-size:13px;font-weight:700;color:#0B3D24;}
  .hero-visual{
    width:120px;height:100px;background:rgba(255,255,255,.55);border-radius:14px;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#0B3D24;font-weight:700;
  }

  /* ===================== quick icons ===================== */
  .quick-icons{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px;}
  .qi-card{
    background:var(--white);border:1px solid var(--line);border-radius:12px;
    padding:20px 8px;text-align:center;font-size:12.5px;font-weight:700;color:var(--gray-700);
  }
  .qi-card:hover{border-color:var(--green);color:var(--green-deep);}
  .qi-icon{
    width:34px;height:34px;border-radius:50%;background:var(--green-tint);color:var(--green-deep);
    display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:15px;
  }
  @media (max-width:700px){ .quick-icons{grid-template-columns:repeat(3,1fr);} }

  .ad-strip{
    background:var(--surface);border-radius:10px;padding:14px 18px;margin-bottom:30px;
    display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--gray-700);
  }
  .ad-strip button{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;}

  .mybiz-title{font-size:16px;font-weight:800;margin-bottom:14px;}
  .mybiz-title span{color:var(--green-deep);}
  .mybiz-card{
    display:flex;align-items:center;gap:16px;
    background:var(--white);border:1px solid var(--line);border-radius:12px;
    padding:18px 20px;cursor:pointer;
  }
  .mybiz-card:hover{border-color:var(--green);}
  .mybiz-thumb{
    width:56px;height:56px;border-radius:10px;flex-shrink:0;
    background:linear-gradient(135deg,#dfe3e6,#eef0f1);
  }
  .mybiz-name{font-size:15.5px;font-weight:700;color:var(--ink);}
  .mybiz-chev{margin-left:auto;color:var(--gray-300);font-size:18px;}

  /* ===================== NEW BIZ (dead-end) ===================== */
  .nb-back{display:inline-flex;align-items:center;gap:6px;color:var(--gray-500);font-size:14px;margin-bottom:18px;cursor:pointer;}
  .nb-back:hover{color:var(--ink);}
  .nb-title{font-size:24px;font-weight:800;text-align:center;margin-bottom:26px;}
  .nb-search{
    max-width:620px;margin:0 auto 26px;position:relative;
  }
  .nb-search input{
    width:100%;border:1.5px solid var(--line);border-radius:10px;padding:14px 44px 14px 16px;
    font-size:14px;background:var(--surface);color:var(--gray-500);
  }
  .nb-search .ic{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--gray-300);}
  .nb-box{max-width:620px;margin:0 auto;background:var(--surface);border-radius:14px;padding:26px 28px;}
  .nb-box h3{font-size:16px;margin:0 0 4px;}
  .nb-box p{font-size:12.5px;color:var(--gray-500);margin:0 0 18px;}
  .nb-opt{background:var(--white);border-radius:10px;padding:16px 18px;margin-bottom:12px;}
  .nb-opt .num{display:inline-block;background:var(--gray-700);color:#fff;font-size:11px;font-weight:700;
    border-radius:4px;padding:1px 6px;margin-right:6px;}
  .nb-opt .lead{font-size:13.5px;font-weight:700;margin-bottom:10px;}
  .nb-chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .nb-chip{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:12px;color:var(--gray-500);}
  .nb-chip.on{border-color:var(--green);color:var(--green-deep);font-weight:700;}
  .nb-fake-field{display:flex;gap:10px;font-size:12px;color:var(--gray-500);margin-bottom:10px;flex-wrap:wrap;}
  .nb-notes{font-size:12px;color:var(--gray-500);line-height:2;max-width:620px;margin:20px auto 0;}
  .nb-cta{max-width:620px;margin:22px auto 0;display:flex;flex-direction:column;gap:10px;}
  .nb-cta button{
    border:none;border-radius:10px;padding:15px;color:#fff;font-size:14px;font-weight:700;
    display:flex;align-items:center;justify-content:space-between;padding-left:20px;padding-right:20px;
  }
  .nb-cta button.g{background:var(--green);}
  .nb-cta button.p{background:var(--purple);}
  .nb-toast{
    max-width:620px;margin:14px auto 0;background:var(--alert-tint);color:#C81E2C;
    border-radius:8px;padding:10px 14px;font-size:12.5px;text-align:center;display:none;
  }
  .nb-toast.show{display:block;}

  /* ===================== BIZ DETAIL (dark sidebar, matches real SmartPlace) ===================== */
  .biz-layout{display:grid;grid-template-columns:220px 1fr;gap:0;max-width:1240px;margin:0 auto;align-items:start;}
  .biz-sidebar{background:#1C1C1E;padding:20px 14px 24px;align-self:stretch;}
  .biz-sidebar .biz-head{
    display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:#fff;padding:6px 8px 18px;
    border-bottom:1px solid #333;margin-bottom:10px;
  }
  .biz-sidebar .biz-head .thumb{width:26px;height:26px;border-radius:6px;background:#3a3a3c;flex-shrink:0;}
  .biz-nav-item{
    padding:11px 10px;border-radius:8px;font-size:13.5px;color:#B0B0B3;
    display:flex;align-items:center;gap:10px;margin-bottom:2px;cursor:default;
  }
  .biz-nav-item .dot{width:6px;height:6px;border-radius:50%;background:#5a5a5c;}
  .biz-nav-item.active{background:#2C2C2E;color:#fff;font-weight:700;}
  .biz-nav-item.active .dot{background:var(--green);}
  .biz-sidebar-foot{margin-top:18px;padding-top:14px;border-top:1px solid #333;display:flex;gap:14px;font-size:11.5px;color:#7a7a7c;}
  .biz-main{padding:0 0 60px;min-width:0;}
  .biz-hero{
    position:relative;height:230px;background:linear-gradient(135deg,#cfd6da,#e7ebed);
    display:flex;flex-direction:column;justify-content:flex-end;padding:22px 28px;color:#fff;
  }
  .biz-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.45),rgba(0,0,0,0) 60%);}
  .biz-hero > *{position:relative;z-index:1;}
  .biz-hero-name{font-size:22px;font-weight:800;}
  .biz-hero-status{font-size:12.5px;margin:6px 0 2px;opacity:.9;}
  .biz-hero-hours{font-size:15px;font-weight:700;}
  .biz-actions{display:flex;gap:10px;padding:18px 28px;border-bottom:1px solid var(--line);}
  .biz-actions button{
    border:1px solid var(--line);background:var(--white);border-radius:9px;
    padding:11px 18px;font-size:13.5px;font-weight:700;color:var(--gray-700);
  }
  .biz-actions button.primary{background:var(--green);color:#fff;border-color:var(--green);}
  .biz-actions button.primary:hover{background:var(--green-deep);}
  .biz-notice{margin:18px 28px 0;background:var(--alert-tint);color:#C81E2C;font-size:12.5px;
    padding:10px 14px;border-radius:8px;}
  .biz-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px 28px;}
  .stat-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:18px 20px;}
  .stat-card h4{font-size:13.5px;margin:0 0 14px;display:flex;justify-content:space-between;}
  .stat-nums{display:flex;gap:22px;}
  .stat-nums div{text-align:center;}
  .stat-nums b{display:block;font-size:19px;color:var(--ink);}
  .stat-nums span{font-size:11px;color:var(--gray-500);}

  /* ===================== WIZARD (embedded) — reused styling ===================== */
  .wz-topbar{background:var(--white);border-bottom:1px solid var(--line);padding:14px 24px;
    display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
  .wz-back{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--gray-500);cursor:pointer;}
  .wz-back:hover{color:var(--ink);}
  .wz-layout{max-width:1240px;margin:0 auto;padding:28px 24px 80px;display:grid;
    grid-template-columns:minmax(0,1fr) 380px;gap:32px;align-items:start;}
  @media (max-width:960px){.wz-layout{grid-template-columns:1fr;} .wz-preview-col{order:-1;position:static;}}
  .wz-panel{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:28px 28px 24px;}
  .wz-steps-nav{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap;}
  .wz-dot{flex:1;min-width:34px;height:5px;border-radius:3px;background:var(--line);}
  .wz-dot.done{background:var(--green);} .wz-dot.current{background:var(--green-deep);}
  .wz-step-label{font-size:12px;font-weight:700;color:var(--green-deep);margin-bottom:6px;}
  .wz-step-title{font-size:21px;font-weight:700;margin:0 0 6px;}
  .wz-step-desc{font-size:13.5px;color:var(--gray-500);margin:0 0 22px;line-height:1.55;}
  .wz-field{margin-bottom:20px;}
  .wz-field label{display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:8px;}
  .wz-field input[type=text], .wz-field textarea, .wz-field select{
    width:100%;border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;font-size:15px;outline:none;}
  .wz-field input[type=text]:focus,.wz-field textarea:focus,.wz-field select:focus{border-color:var(--green);}
  .wz-field textarea{resize:vertical;min-height:110px;line-height:1.6;}
  .wz-field-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--gray-500);margin-top:6px;}
  .wz-hint{display:flex;gap:8px;background:var(--surface);border-radius:8px;padding:10px 12px;
    font-size:12.5px;color:var(--gray-500);line-height:1.5;margin-top:8px;}
  .wz-hint b{color:var(--gray-700);}
  .wz-warn{display:none;gap:8px;background:var(--alert-tint);color:#C81E2C;border-radius:8px;
    padding:10px 12px;font-size:12.5px;line-height:1.5;margin-top:8px;}
  .wz-warn.show{display:flex;}
  .wz-ok{display:none;gap:8px;align-items:center;background:var(--green-tint);color:var(--green-deep);
    border-radius:8px;padding:9px 12px;font-size:12.5px;font-weight:600;margin-top:8px;}
  .wz-ok.show{display:flex;}
  .wz-photo-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  .wz-photo-slot{position:relative;aspect-ratio:1/1;border:1.5px dashed var(--gray-300);border-radius:10px;
    background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;overflow:hidden;color:var(--gray-500);font-size:11px;text-align:center;}
  .wz-photo-slot:hover{border-color:var(--green);}
  .wz-photo-slot img{width:100%;height:100%;object-fit:cover;}
  .wz-photo-slot .crown{position:absolute;top:4px;left:4px;font-size:14px;}
  .wz-photo-slot .num{position:absolute;bottom:4px;right:6px;font-size:10px;font-weight:700;color:var(--gray-500);
    background:rgba(255,255,255,.8);border-radius:4px;padding:0 4px;}
  .wz-photo-slot.filled{border-style:solid;border-color:var(--line);}
  .wz-toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
    border:1.5px solid var(--line);border-radius:10px;margin-bottom:10px;}
  .wz-toggle-row .tn2{font-size:14.5px;font-weight:700;} .wz-toggle-row .td2{font-size:12px;color:var(--gray-500);margin-top:2px;}
  .wz-switch{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex-shrink:0;transition:background .15s;}
  .wz-switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s;}
  .wz-switch.on{background:var(--green);} .wz-switch.on::after{left:21px;}
  .wz-nav-btns{display:flex;justify-content:space-between;margin-top:26px;padding-top:20px;border-top:1px solid var(--line);}
  .wz-btn{padding:12px 22px;border-radius:9px;font-size:14.5px;font-weight:700;border:none;}
  .wz-btn-primary{background:var(--green);color:#fff;} .wz-btn-primary:hover{background:var(--green-deep);}
  .wz-btn-ghost{background:none;color:var(--gray-500);} .wz-btn-ghost:hover{color:var(--ink);}
  .wz-btn:disabled{opacity:.35;cursor:default;}
  .wz-score-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);}
  .wz-score-row:last-child{border-bottom:none;}
  .wz-score-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;color:#fff;flex-shrink:0;}
  .wz-score-icon.good{background:var(--green);} .wz-score-icon.bad{background:var(--alert);}
  .wz-score-text{font-size:14px;color:var(--gray-700);} .wz-score-text b{color:var(--ink);}
  .wz-preview-col{position:sticky;top:78px;}
  .wz-preview-label{font-size:12px;font-weight:700;color:var(--gray-500);margin-bottom:10px;text-align:center;}
  .phone{width:100%;max-width:340px;margin:0 auto;background:#1b1b1b;border-radius:36px;padding:12px;
    box-shadow:0 20px 40px rgba(0,0,0,.18);}
  .phone-notch{width:90px;height:18px;background:#1b1b1b;border-radius:0 0 14px 14px;margin:0 auto;}
  .phone-screen{background:#fff;border-radius:26px;overflow:hidden;height:640px;overflow-y:auto;
    display:flex;flex-direction:column;}
  .ph-scroll{flex:1;overflow-y:auto;}

  .ph-topbar{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;flex-shrink:0;}
  .ph-topbar .back{font-size:17px;color:var(--gray-700);}
  .ph-topbar .title{flex:1;font-size:14.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ph-topbar .star{font-size:15px;color:var(--gray-300);}

  .ph-carousel{display:flex;gap:2px;overflow-x:auto;background:var(--surface);}
  .ph-carousel .slide{flex:0 0 50%;aspect-ratio:1/1;background:linear-gradient(135deg,#dfe3e6,#eef0f1);
    display:flex;align-items:center;justify-content:center;color:var(--gray-300);font-size:11px;}
  .ph-carousel .slide img{width:100%;height:100%;object-fit:cover;}

  .ph-title-block{padding:14px 16px 4px;}
  .ph-title-block .pname{font-size:19px;font-weight:800;color:var(--ink);word-break:keep-all;}
  .ph-title-block .pmeta{font-size:12px;color:var(--gray-500);margin-top:5px;}

  .ph-actionbar{display:flex;gap:6px;padding:12px 16px 14px;}
  .ph-actionbar .pill{flex:1;border-radius:20px;padding:9px 2px;text-align:center;font-size:10.5px;font-weight:700;
    border:1px solid var(--line);color:var(--gray-700);background:#fff;}
  .ph-actionbar .pill.primary{background:#3B82F6;color:#fff;border-color:#3B82F6;}
  .ph-actionbar .pill.dim{opacity:.4;}

  .ph-tabbar{display:flex;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0;}
  .ph-tabbar span{font-size:12px;color:var(--gray-500);padding:10px 0;white-space:nowrap;}
  .ph-tabbar span.active{color:var(--ink);font-weight:800;border-bottom:2px solid var(--ink);}

  .ph-coupon{background:var(--surface);border-radius:10px;margin:12px 16px;padding:12px 14px;
    display:flex;justify-content:space-between;align-items:center;}
  .ph-coupon .l{font-size:11.5px;color:var(--gray-700);} .ph-coupon .l b{color:var(--ink);}
  .ph-coupon .r{font-size:11px;color:var(--green-deep);font-weight:700;}
  .ph-news{margin:0 16px 14px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--gray-700);}
  .ph-news .thumb{width:34px;height:34px;border-radius:7px;background:var(--surface);flex-shrink:0;}

  .ph-row{display:flex;gap:10px;padding:11px 16px;border-bottom:6px solid var(--surface);}
  .ph-row .ic{width:16px;flex-shrink:0;text-align:center;color:var(--gray-500);font-size:13px;padding-top:1px;}
  .ph-row .body{flex:1;min-width:0;font-size:12px;color:var(--gray-700);line-height:1.55;}
  .ph-row .body .maintext{font-size:13px;color:var(--ink);font-weight:600;}
  .ph-row .body .links{margin-top:4px;color:#3B82F6;font-size:11px;}
  .ph-subway-badge{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
    border-radius:50%;background:var(--green-deep);color:#fff;font-size:9px;font-weight:800;margin-right:5px;}

<script>
/* ============================================================
   GLOBAL STATE
============================================================ */
let userName = localStorage.getItem('placeSimUser') || "";
let view = userName ? 'dashboard' : 'login';

function escapeHtml(str){
  return (str||"").replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function goto(v){ view = v; render(); window.scrollTo({top:0}); }

function render(){
  const app = document.getElementById('app');
  if(view === 'login') app.innerHTML = viewLogin();
  else if(view === 'dashboard') app.innerHTML = viewDashboard();
  else if(view === 'newbiz') app.innerHTML = viewNewBiz();
  else if(view === 'bizdetail') app.innerHTML = viewBizDetail();
  else if(view === 'wizard') { app.innerHTML = viewWizardShell(); initWizard(); }
}

/* ============================================================
   LOGIN VIEW
============================================================ */
function viewLogin(){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-badge">P</div>
      <h1 class="login-title">플레이스 실습 로그인</h1>
      <p class="login-sub">강의용 연습 계정입니다. 이름을 입력하면<br/>내 이름으로 된 업체를 실습해볼 수 있어요.</p>
      <div class="login-field">
        <label>이름</label>
        <input type="text" id="loginName" placeholder="이름을 입력해주세요" onkeydown="if(event.key==='Enter')doLogin()"/>
      </div>
      <button class="login-btn" id="loginBtn" onclick="doLogin()">로그인</button>
      <div class="login-foot">© 실습용 시뮬레이터 — 실제 네이버 서비스와 무관합니다</div>
    </div>
  </div>`;
}
function doLogin(){
  const v = document.getElementById('loginName').value.trim();
  if(!v){ document.getElementById('loginName').focus(); return; }
  userName = v;
  localStorage.setItem('placeSimUser', v);
  goto('dashboard');
}
function doLogout(){
  localStorage.removeItem('placeSimUser');
  userName = "";
  goto('login');
}

/* ---------------- REVIEW ---------------- */
function wzRenderReview(){
  const checks = wzChecklist();
  const rows = checks.map(c=>`<div class="wz-score-row"><div class="wz-score-icon ${c.pass?'good':'bad'}">${c.pass?'✓':'!'}</div><div class="wz-score-text">${c.text}</div></div>`).join("");
  const passCount = checks.filter(c=>c.pass).length;
  return `
  <div class="form-scroll">
    <div class="wz-step-label">저장 완료</div>
    <h2 class="wz-step-title">실습 결과 체크리스트</h2>
    <p class="wz-step-desc">${passCount} / ${checks.length}개 항목을 통과했어요. 부족한 항목은 수정으로 돌아가 고쳐보세요.</p>
    <div style="margin-bottom:24px;">${rows}</div>
    <span class="wz-back" style="display:inline-flex;" onclick="wz.reviewMode=false; wzRenderForm();">← 수정으로 돌아가기</span>
  </div>`;
}
function wzChecklist(){
  const commaHeavy = wzIsCommaHeavy(wz.intro);
  return [
    {text:`<b>상호명</b>에 증빙 어려운 최상급 표현이 없어요`, pass: wz.name.length>0 && !wzHasBanned(wz.name)},
    {text:`<b>업종</b>을 입력했어요`, pass: wz.category.trim().length>0},
    {text:`<b>찾아오는 길</b>에 위치 정보를 문장으로 작성했어요`, pass: wz.way.length >= 15},
    {text:`<b>상세설명</b>을 문장형으로 작성했어요 (쉼표 나열 아님)`, pass: wz.intro.length>0 && !commaHeavy},
    {text:`<b>대표 사진</b>을 5장 이상 채웠어요`, pass: wz.photos.length>=5},
    {text:`<b>전화번호·주소</b>를 모두 입력했어요`, pass: wz.phoneNum.length>0 && wz.addr1.length>0},
  ];
}
function wzHasBanned(str){ return BANNED_WORDS.some(w=>str.includes(w)); }
function wzIsCommaHeavy(str){ if(!str) return false; const c=(str.match(/,/g)||[]).length; const p=(str.match(/[.!?]/g)||[]).length; return c>=2 && p===0; }
function wzSave(){ wz.reviewMode = true; wzRenderForm(); window.scrollTo({top:0,behavior:'smooth'}); }

/* ---------------- FEEDBACK (warnings/ok chips) ---------------- */
function wzUpdateFeedback(){
  const nameCount = document.getElementById('wzNameCount'); if(nameCount) nameCount.textContent = wz.name.length;
  const engCount = document.getElementById('wzEngCount'); if(engCount) engCount.textContent = wz.engName.length;
  const introCount = document.getElementById('wzIntroCount'); if(introCount) introCount.textContent = wz.intro.length;
  const wayCount = document.getElementById('wzWayCount'); if(wayCount) wayCount.textContent = wz.way.length;

  const nw=document.getElementById('wzNameWarn'), no=document.getElementById('wzNameOk');
  if(nw){
    if(wz.name && wzHasBanned(wz.name)){ nw.querySelector('span').textContent="이 표현은 사업자등록증·공식 서류로 증빙되지 않으면 반려될 수 있어요."; nw.classList.add('show'); no.classList.remove('show'); }
    else if(wz.name){ nw.classList.remove('show'); no.classList.add('show'); }
    else { nw.classList.remove('show'); no.classList.remove('show'); }
  }
  const ww=document.getElementById('wzWayWarn');
  if(ww){
    const words = wz.way.split(/\s+/).filter(Boolean); const freq={};
    words.forEach(x=>{ if(x.length>=2) freq[x]=(freq[x]||0)+1; });
    const rep = Object.keys(freq).find(x=>freq[x]>=3);
    if(rep){ ww.querySelector('span').textContent = `"${rep}"가 반복되고 있어요. 이 영역은 업종 키워드가 아닌 위치 정보 중심으로 작성해보세요.`; ww.classList.add('show'); }
    else ww.classList.remove('show');
  }
  const iw=document.getElementById('wzIntroWarn'), io=document.getElementById('wzIntroOk');
  if(iw){
    if(wz.intro && wzIsCommaHeavy(wz.intro)){ iw.querySelector('span').textContent="쉼표로 나열된 낱말은 AI가 읽기 어렵습니다. 문장형으로 다시 써보세요."; iw.classList.add('show'); io.classList.remove('show'); }
    else if(wz.intro.length>=20){ iw.classList.remove('show'); io.classList.add('show'); }
    else { iw.classList.remove('show'); io.classList.remove('show'); }
  }
  const pw=document.getElementById('wzPhotoWarn'), po=document.getElementById('wzPhotoOk');
  if(pw){
    const filled = wz.photos.length;
    if(filled>0 && filled<5){ pw.querySelector('span').textContent = `현재 ${filled}장 채워졌어요. 5장 이상 채우면 노출에 더 유리합니다.`; pw.classList.add('show'); po.classList.remove('show'); }
    else if(filled>=5){ pw.classList.remove('show'); po.classList.add('show'); }
    else { pw.classList.remove('show'); po.classList.remove('show'); }
  }
}

/* ---------------- FIELD HANDLERS ---------------- */
function wzOnName(v){ wz.name=v; wzUpdateFeedback(); wzRenderPreview(); }
function wzOnEng(v){ wz.engName=v; wzUpdateFeedback(); }
function wzOnCat(v){ wz.category=v; wzRenderPreview(); }
function wzOnIntro(v){ wz.intro=v.slice(0,2000); wzUpdateFeedback(); wzRenderPreview(); }
function wzOnWay(v){ wz.way=v.slice(0,400); wzUpdateFeedback(); wzRenderPreview(); }
function wzOnPhoneCode(v){ wz.phoneCode=v; }
function wzOnPhoneNum(v){ wz.phoneNum=v.replace(/[^0-9]/g,''); }
function wzOnAddr1(v){ wz.addr1=v; }
function wzOnAddr2(v){ wz.addr2=v; }
function wzToggleSmartcall(){ wz.smartcall=!wz.smartcall; wzRenderForm(); }
function wzConfirmLocation(val){ wz.locationConfirmed=val; document.getElementById('wzLocOk').classList.toggle('show', val); }
function wzSetNotify(v){ wz.notify=v; wzRenderForm(); }

function wzAttachFile(){
  wz.certFile = `${wz.name || '업체명'}_사업자등록증.jpg`;
  wzRenderForm();
}
function wzRemoveFile(){ wz.certFile=""; wzRenderForm(); }

/* ---------------- KEYWORDS ---------------- */
function wzAddKeyword(){
  const input = document.getElementById('wz-kw-input');
  const v = input.value.trim();
  if(!v || wz.keywords.length>=5) return;
  wz.keywords.push(v);
  input.value = "";
  wzRenderKeywordChips();
  wzRenderPreview();
}
function wzRemoveKeyword(i){ wz.keywords.splice(i,1); wzRenderKeywordChips(); wzRenderPreview(); }
function wzRenderKeywordChips(){
  const box = document.getElementById('wzKwChips'); if(!box) return;
  box.innerHTML = wz.keywords.map((k,i)=>`<div class="kw-chip">${escapeHtml(k)}<span class="x" onclick="wzRemoveKeyword(${i})">✕</span></div>`).join("");
  const addBtn = document.getElementById('wz-kw-add');
  if(addBtn) addBtn.classList.toggle('active', wz.keywords.length<5);
}

/* ---------------- MENU / PRICE LIST ---------------- */
function wzAddMenuItem(){
  const nameEl = document.getElementById('wz-menu-name');
  const priceEl = document.getElementById('wz-menu-price');
  const name = nameEl.value.trim();
  if(!name) return;
  const price = priceEl.value.trim();
  wz.menuItems.push({name, price});
  nameEl.value = ""; priceEl.value = "";
  wzRenderMenuList();
  wzRenderPreview();
  nameEl.focus();
}
function wzRemoveMenuItem(i){ wz.menuItems.splice(i,1); wzRenderMenuList(); wzRenderPreview(); }
function wzRenderMenuList(){
  const box = document.getElementById('wzMenuList'); if(!box) return;
  box.innerHTML = wz.menuItems.map((m,i)=>`
    <div class="menu-row">
      <span>${escapeHtml(m.name)}</span>
      <span style="display:flex;align-items:center;">
        <span class="mprice">${m.price ? escapeHtml(m.price) : '변동'}</span>
        <span class="x" onclick="wzRemoveMenuItem(${i})">✕</span>
      </span>
    </div>`).join("");
}

/* ---------------- PHOTOS ---------------- */
function wzRenderPhotoGrid(){
  const grid = document.getElementById('wzPhotoGrid'); if(!grid) return;
  grid.innerHTML = "";
  const addCell = document.createElement('div');
  addCell.className = 'photo-slot-lg';
  addCell.innerHTML = `<div>＋</div><div>사진추가<br/>드래그 가능</div>`;
  addCell.onclick = wzPickPhoto;
  grid.appendChild(addCell);

  wz.photos.forEach((p,i)=>{
    const cell = document.createElement('div');
    cell.className = 'photo-slot-lg';
    cell.innerHTML = `<img src="${p}"/>${i===0?'<div class="badge">대표</div>':''}<div class="num" style="position:absolute;top:5px;right:5px;background:rgba(255,255,255,.85);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;">✕</div>`;
    cell.querySelector('.num').onclick = (e)=>{ e.stopPropagation(); wz.photos.splice(i,1); wzRenderPhotoGrid(); wzUpdateFeedback(); wzRenderPreview(); };
    grid.appendChild(cell);
  });
}
function wzPickPhoto(){
  if(wz.photos.length>=10) return;
  const input = document.createElement('input');
  input.type='file'; input.accept='image/*';
  input.onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{ wz.photos.push(ev.target.result); wzRenderPhotoGrid(); wzUpdateFeedback(); wzRenderPreview(); };
    reader.readAsDataURL(file);
  };
  input.click();
}

/* ---------------- PHONE PREVIEW ---------------- */
let wzPreviewTab = 'home';
function wzSetTab(t){ wzPreviewTab = t; wzRenderPreview(); }

const PH_TABS = [
  {id:'home', label:'홈'},
  {id:'news', label:'소식'},
  {id:'review', label:'리뷰'},
  {id:'photo', label:'사진'},
  {id:'map', label:'지도'},
  {id:'nearby', label:'주변'},
  {id:'info', label:'정보'},
];

function wzRenderPreview(){
  const screen = document.getElementById('wzPhone'); if(!screen) return;
  const introHtml = wz.intro ? wzHighlightAnchor(wz.intro) : `<span class="ph-empty">아직 작성된 소개글이 없습니다</span>`;
  const wayHtml = wz.way ? escapeHtml(wz.way) : `<span class="ph-empty">찾아오는 길 정보가 없습니다</span>`;
  const addrHtml = wz.addr1 ? `${escapeHtml(wz.addr1)}${wz.addr2 ? ' ' + escapeHtml(wz.addr2) : ''}` : `<span class="ph-empty">주소가 입력되지 않았습니다</span>`;
  const phoneHtml = wz.phoneNum ? `${wz.phoneCode}-${escapeHtml(wz.phoneNum)}` : `<span class="ph-empty">전화번호가 입력되지 않았습니다</span>`;
  const catHtml = wz.category ? escapeHtml(wz.category) : "업종 미입력";
  const hasPhone = wz.phoneNum.length > 0;
  const photoCount = wz.photos.length;

  const carouselSlides = photoCount
    ? wz.photos.slice(0,4).map(p=>`<div class="slide"><img src="${p}"/></div>`).join("")
    : `<div class="slide">대표사진</div><div class="slide">사진을 등록해보세요</div>`;

  const actionBar = `
    <div class="ph-actionbar">
      <div class="pill">↑ 길찾기</div>
      <div class="pill">⇗ 공유</div>
      <div class="pill">🔔 알림받기</div>
    </div>`;

  const tabbarHtml = `
    <div class="ph-tabbar">
      ${PH_TABS.map(t=>`<span class="${t.id===wzPreviewTab?'active':''}" onclick="wzSetTab('${t.id}')">${t.label}</span>`).join("")}
    </div>`;

  let contentHtml = "";
  if(wzPreviewTab==='home'){
    contentHtml = `
      <div class="ph-row">
        <div class="ic">📍</div>
        <div class="body"><div class="maintext">${addrHtml}</div><div class="links">지도 · 내비게이션 · 거리뷰</div></div>
      </div>
      <div class="ph-row">
        <div class="ic">🚇</div>
        <div class="body"><span class="ph-empty">정보 없음</span></div>
      </div>
      <div class="ph-row">
        <div class="ic">↗</div>
        <div class="body"><div class="ph-intro-preview">${wayHtml}</div></div>
      </div>
      <div class="ph-row">
        <div class="ic">☎</div>
        <div class="body">${phoneHtml}${hasPhone ? ` <span style="color:#3B82F6;">· 복사</span>` : ``}</div>
      </div>
      <div class="ph-row">
        <div class="ic">₩</div>
        <div class="body">${wz.menuItems.length ? wz.menuItems.map(m=>`<div class="ph-price-row"><span>${escapeHtml(m.name)}</span><span class="amt">${m.price?escapeHtml(m.price):'변동'}</span></div>`).join("") : ``}</div>
      </div>
      <div class="ph-row">
        <div class="ic">🌐</div>
        <div class="body"><span class="ph-empty">정보 없음</span></div>
      </div>
      <div class="ph-row" style="border-bottom:none;">
        <div class="ic">🏬</div>
        <div class="body"><span class="ph-empty">정보 없음</span></div>
      </div>`;
  }
  else if(wzPreviewTab==='news'){
    contentHtml = `
      <div class="ph-newscard"><div class="thumb"></div><div><div class="date">2026.08.24 <span class="ph-example-badge">예시</span></div>웰컴 오퍼 — 첫 방문 혜택 안내</div></div>
      <div class="ph-newscard"><div class="thumb"></div><div><div class="date">2026.07.02 <span class="ph-example-badge">예시</span></div>여름 시즌 프로그램 오픈</div></div>
      <div class="ph-newscard"><div class="thumb"></div><div><div class="date">2026.05.14 <span class="ph-example-badge">예시</span></div>신규 강사진 합류 소식</div></div>
      <div class="ph-tab-empty">소식은 예시 화면입니다.<br/>실습에서는 작성하지 않아요.</div>`;
  }
  else if(wzPreviewTab==='review'){
    const revs = [
      {n:"방문자***", s:"★★★★★", t:"시설이 깨끗하고 선생님이 꼼꼼하게 봐주셔서 좋았어요."},
      {n:"예약자***", s:"★★★★☆", t:"위치 찾기 쉽고 주차도 편했습니다."},
    ];
    contentHtml = `
      ${revs.map(r=>`
        <div class="ph-reviewcard">
          <div class="rtop"><div class="avatar"></div><div><div class="rname">${r.n}</div><div class="stars">${r.s}</div></div></div>
          <div class="rtext">${r.t}</div>
        </div>`).join("")}
      <div class="ph-tab-empty">리뷰는 예시 화면입니다.<br/>실습에서는 실제 리뷰가 쌓이지 않아요.</div>`;
  }
  else if(wzPreviewTab==='photo'){
    if(photoCount){
      contentHtml = `<div class="ph-photogrid">${wz.photos.map(p=>`<div><img src="${p}"/></div>`).join("")}</div>`;
    } else {
      contentHtml = `<div class="ph-tab-empty">아직 등록된 사진이 없습니다.<br/>대표 사진 단계에서 사진을 추가해보세요.</div>`;
    }
  }
  else if(wzPreviewTab==='map'){
    contentHtml = `<div class="ph-tab-empty">🗺️<br/><br/>지도 탭은 예시 화면이에요.<br/>실습에서는 지원하지 않습니다.</div>`;
  }
  else if(wzPreviewTab==='nearby'){
    contentHtml = `<div class="ph-tab-empty">📍<br/><br/>주변 탭은 예시 화면이에요.<br/>실습에서는 지원하지 않습니다.</div>`;
  }
  else if(wzPreviewTab==='info'){
    contentHtml = `
      <div class="ph-info-section"><h5>상호명</h5><div class="val">${wz.name ? escapeHtml(wz.name) : `<span class="ph-empty">미입력</span>`}</div></div>
      <div class="ph-info-section"><h5>업종</h5><div class="val">${catHtml}</div></div>
      <div class="ph-info-section"><h5>전화번호</h5><div class="val">${phoneHtml}</div></div>
      <div class="ph-info-section"><h5>주소</h5><div class="val">${addrHtml}</div></div>
      <div class="ph-info-section"><h5>찾아오는 길</h5><div class="val">${wayHtml}</div></div>
      <div class="ph-info-section"><h5>소개</h5><div class="val ph-intro-preview">${introHtml}</div></div>
      ${wz.keywords.length ? `<div class="ph-info-section"><h5>대표키워드</h5><div class="val">${wz.keywords.map(k=>`<span class="ph-tag">${escapeHtml(k)}</span>`).join("")}</div></div>` : ``}
      <div class="ph-info-section" style="border-bottom:none;"><h5>메뉴/가격표</h5><div class="val">${wz.menuItems.length ? wz.menuItems.map(m=>`<div class="ph-price-row"><span>${escapeHtml(m.name)}</span><span class="amt">${m.price?escapeHtml(m.price):'변동'}</span></div>`).join("") : ``}</div></div>`;
  }

  screen.innerHTML = `
    <div class="ph-topbar">
      <span class="back">‹</span>
      <span class="title">${wz.name ? escapeHtml(wz.name) : "상호명을 입력해보세요"}</span>
      <span class="star">☆</span>
    </div>
    <div class="ph-scroll">
      <div class="ph-title-block">
        <div class="pname">${wz.name ? escapeHtml(wz.name) : "상호명을 입력해보세요"}</div>
        <div class="pmeta">${catHtml} · 리뷰 0</div>
        <div class="pmeta">영업 중 · 22:00에 영업 종료 <span class="ph-placeholder-note">(예시)</span></div>
      </div>
      ${actionBar}
      <div class="ph-carousel">${carouselSlides}</div>
      ${tabbarHtml}
      ${contentHtml}
    </div>`;
}
function wzHighlightAnchor(text){
  const esc = escapeHtml(text); const cut = Math.max(1, Math.round(esc.length*0.2));
  return `<span class="anchor">${esc.slice(0,cut)}</span>${esc.slice(cut)}`;
}

/* ============================================================
   INIT
============================================================ */
render();
</script>
